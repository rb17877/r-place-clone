<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonkistan — Pixel Savaşı</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f14; color: #e8e8f0; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a1a24; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3a; }
  .logo { font-size: 20px; font-weight: bold; color: #ff4d6d; }
  .user-area { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #ff4d6d; color: white; }
  .btn-primary:disabled { background: #555; cursor: not-allowed; }
  .btn-secondary { background: #2a2a3a; color: #e8e8f0; }
  .btn-google { background: white; color: #333; display: flex; align-items: center; gap: 8px; text-decoration: none; justify-content: center; padding: 10px; border-radius: 6px; }
  main { flex: 1; display: flex; gap: 16px; padding: 16px; overflow: hidden; }
  #canvas-wrap { flex: 1; background: #1a1a24; border-radius: 8px; overflow: auto; border: 1px solid #2a2a3a; }
  #board { display: block; cursor: crosshair; image-rendering: pixelated; }
  .sidebar { width: 280px; background: #1a1a24; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #2a2a3a; overflow-y: auto; }
  .section-title { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
  .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .color-swatch { aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
  .color-swatch.selected { border-color: white; }
  .cooldown-bar { height: 6px; background: #2a2a3a; border-radius: 3px; overflow: hidden; }
  .cooldown-fill { height: 100%; background: #ff4d6d; width: 0%; transition: width 0.1s linear; }
  .cooldown-text { font-size: 13px; color: #aaa; margin-top: 4px; text-align: center; }
  .coords { font-family: monospace; font-size: 13px; color: #aaa; text-align: center; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.active { display: flex; }
  .modal { background: #1a1a24; border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; border: 1px solid #2a2a3a; }
  .modal h2 { margin-bottom: 16px; color: #ff4d6d; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
  .form-group input { width: 100%; padding: 10px; background: #0f0f14; border: 1px solid #2a2a3a; border-radius: 6px; color: #e8e8f0; font-size: 14px; }
  .form-group input:focus { outline: none; border-color: #ff4d6d; }
  .form-error { color: #ff4d6d; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .form-footer { margin-top: 12px; text-align: center; font-size: 13px; color: #aaa; }
  .form-footer a { color: #ff4d6d; cursor: pointer; text-decoration: underline; }
  .divider { display: flex; align-items: center; gap: 8px; margin: 16px 0; color: #666; font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a3a; }
  .image-preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 8px; display: none; }
  .image-preview.active { display: block; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a24; border: 1px solid #ff4d6d; color: #e8e8f0; padding: 12px 20px; border-radius: 8px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">✦ bonkistan</div>
  <div class="user-area" id="userArea">
    <button class="btn btn-secondary" onclick="openModal('login')">Giriş Yap</button>
    <button class="btn btn-primary" onclick="openModal('register')">Kayıt Ol</button>
  </div>
</header>

<main>
  <div id="canvas-wrap">
    <canvas id="board"></canvas>
  </div>

  <aside class="sidebar">
    <div>
      <div class="section-title">Konum</div>
      <div class="coords" id="coords">Haritaya tıkla</div>
    </div>

    <div>
      <div class="section-title">Renk Paleti</div>
      <div class="palette" id="palette"></div>
    </div>

    <div>
      <div class="section-title">Bekleme Süresi</div>
      <div class="cooldown-bar"><div class="cooldown-fill" id="cooldownFill"></div></div>
      <div class="cooldown-text" id="cooldownText">Hazır</div>
    </div>

    <div>
      <div class="section-title">Resim Yükle</div>
      <input type="file" id="imageInput" accept="image/*" style="font-size:12px;color:#aaa;">
      <img id="imagePreview" class="image-preview">
      <div style="font-size:11px;color:#666;margin-top:4px;">En fazla 500×500. Yükle, sonra haritada yerleştir.</div>
      <button class="btn btn-secondary" id="cancelImageBtn" style="margin-top:8px;display:none;">İptal</button>
    </div>
  </aside>
</main>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>Giriş Yap</h2>
    <form id="loginForm">
      <div class="form-group"><label>E-posta</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Şifre</label><input type="password" name="password" required></div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Giriş Yap</button>
      <div class="divider">veya</div>
      <a href="/auth/google" class="btn-google">Google ile giriş yap</a>
      <div class="form-footer">Hesabın yok mu? <a onclick="switchModal('register')">Kayıt ol</a></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <h2>Kayıt Ol</h2>
    <form id="registerForm">
      <div class="form-group"><label>İsim</label><input type="text" name="name" required minlength="2" maxlength="24"></div>
      <div class="form-group"><label>E-posta</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Şifre (en az 10 karakter)</label><input type="password" name="password" required minlength="10"></div>
      <div class="form-error" id="registerError"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Kayıt Ol</button>
      <div class="divider">veya</div>
      <a href="/auth/google" class="btn-google">Google ile kayıt ol</a>
      <div class="form-footer">Zaten hesabın var mı? <a onclick="switchModal('login')">Giriş yap</a></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const COLORS = ['#ffffff','#c4c4c4','#7d7d7d','#404040','#000000','#ff0000','#ff7f00','#ffff00','#00ff00','#00ffff','#0000ff','#7f00ff','#ff00ff','#a0522d','#ff69b4','#ffd700','#90ee90','#87ceeb'];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const socket = io();

let SIZE = 500;
const PIXEL_SIZE = 10;
let selectedColor = COLORS[0];
let currentUser = null;
let nextPaintAt = 0;
let pendingImage = null;

canvas.width = SIZE * PIXEL_SIZE;
canvas.height = SIZE * PIXEL_SIZE;

const palette = document.getElementById('palette');
COLORS.forEach((color, i) => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (i === 0 ? ' selected' : '');
  sw.style.background = color;
  sw.onclick = () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    selectedColor = color;
  };
  palette.appendChild(sw);
});

function drawPixel(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
}

socket.on('init', data => {
  SIZE = data.size;
  canvas.width = SIZE * PIXEL_SIZE;
  canvas.height = SIZE * PIXEL_SIZE;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  data.pixels.forEach(([id, pixel]) => {
    const x = id % SIZE;
    const y = Math.floor(id / SIZE);
    drawPixel(x, y, pixel.color);
  });
});

socket.on('update', p => drawPixel(p.x, p.y, p.color));
socket.on('imageUpdate', updates => updates.forEach(p => drawPixel(p.x, p.y, p.color)));

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
  const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

  if (pendingImage) { placeImage(x, y); return; }

  socket.emit('place', { x, y, color: selectedColor }, res => {
    if (!res) return;
    if (res.ok) {
      nextPaintAt = res.nextPaintAt;
      startCooldown();
      showToast('Piksel yerleştirildi!');
    } else if (res.wait) {
      showToast(`Bekle: ${Math.ceil(res.wait/1000)}s`);
    } else {
      showToast(res.error || 'Hata');
    }
  });
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
  const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);
  document.getElementById('coords').textContent = `x: ${x}, y: ${y}`;
});

function startCooldown() {
  const fill = document.getElementById('cooldownFill');
  const text = document.getElementById('cooldownText');
  const tick = () => {
    const remaining = nextPaintAt - Date.now();
    if (remaining <= 0) { fill.style.width = '0%'; text.textContent = 'Hazır'; return; }
    fill.style.width = (remaining / 3000 * 100) + '%';
    text.textContent = `${(remaining/1000).toFixed(1)}s`;
    requestAnimationFrame(tick);
  };
  tick();
}

const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const cancelImageBtn = document.getElementById('cancelImageBtn');

imageInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 500;
      let w = img.width, h = img.height;
      if (w > maxSide || h > maxSide) {
        const ratio = Math.min(maxSide / w, maxSide / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0, w, h);
      const data = tctx.getImageData(0, 0, w, h).data;
      const pixels = [];
      for (let i = 0; i < data.length; i += 4) {
        if (data[i+3] < 128) { pixels.push(null); continue; }
        const r = data[i], g = data[i+1], b = data[i+2];
        pixels.push('#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''));
      }
      pendingImage = { width: w, height: h, pixels };
      imagePreview.src = ev.target.result;
      imagePreview.classList.add('active');
      cancelImageBtn.style.display = 'block';
      showToast('Haritada yerleştirmek istediğin yere tıkla');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

cancelImageBtn.onclick = () => {
  pendingImage = null;
  imageInput.value = '';
  imagePreview.classList.remove('active');
  cancelImageBtn.style.display = 'none';
};

function placeImage(x, y) {
  if (!pendingImage) return;
  socket.emit('placeImage', { x, y, ...pendingImage }, res => {
    if (!res) return;
    if (res.ok) {
      nextPaintAt = res.nextPaintAt;
      startCooldown();
      showToast(`${res.count} piksel yerleştirildi!`);
      cancelImageBtn.click();
    } else if (res.wait) {
      showToast(`Bekle: ${Math.ceil(res.wait/1000)}s`);
    } else {
      showToast(res.error || 'Hata');
    }
  });
}

function openModal(which) {
  document.getElementById('loginModal').classList.toggle('active', which === 'login');
  document.getElementById('registerModal').classList.toggle('active', which === 'register');
}
function switchModal(which) { openModal(which); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') })
  });
  const data = await res.json();
  if (res.ok) { document.getElementById('loginModal').classList.remove('active'); loadUser(); }
  else document.getElementById('loginError').textContent = data.error;
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password') })
  });
  const data = await res.json();
  if (res.ok) { document.getElementById('registerModal').classList.remove('active'); loadUser(); }
  else document.getElementById('registerError').textContent = data.error;
});

async function loadUser() {
  const res = await fetch('/api/me');
  const data = await res.json();
  currentUser = data.user;
  const area = document.getElementById('userArea');
  if (currentUser) {
    area.innerHTML = `<span style="font-size:14px;">Merhaba, <b>${currentUser.name}</b></span>
      <button class="btn btn-secondary" onclick="logout()">Çıkış</button>`;
  } else {
    area.innerHTML = `<button class="btn btn-secondary" onclick="openModal('login')">Giriş Yap</button>
      <button class="btn btn-primary" onclick="openModal('register')">Kayıt Ol</button>`;
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  loadUser();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

loadUser();
if (location.search.includes('authError=google')) showToast('Google girişi başarısız');
</script>
</body>
</html>
