<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonkistan — Pixel Savaşı</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1622; color: #e6eef5; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #111d2c; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 20px; }
  #who { font-size: 13px; color: #8fa6bb; }
  main { flex: 1; display: flex; min-height: 0; }
  #wrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #info { position: absolute; left: 10px; bottom: 10px; font: 12px monospace; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 4px; }
  aside { width: 290px; background: #111d2c; padding: 14px; overflow-y: auto; }
  aside h3 { margin: 16px 0 6px; font-size: 13px; color: #8fa6bb; letter-spacing: .05em; }
  input { width: 100%; padding: 8px; margin: 4px 0; background: #0b1622; border: 1px solid #29405a; color: #e6eef5; border-radius: 6px; }
  button { padding: 8px 10px; margin: 4px 4px 4px 0; background: #2a5d8f; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { background: #356fa9; }
  .gbtn { display: block; text-align: center; background: #fff; color: #222; padding: 9px; border-radius: 6px; text-decoration: none; margin: 6px 0; font-weight: 600; }
  .gbtn:hover { background: #eee; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sw { height: 34px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .sw.sel { border-color: #fff; }
  #status { font-size: 13px; color: #f5c770; min-height: 18px; margin-top: 8px; }
  .hidden { display: none; }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; max-height: 50%; } }
</style>
</head>
<body>
<header>
  <b>✦ bonkistan</b>
  <span id="who"></span>
</header>

<main>
  <div id="wrap">
    <canvas id="board"></canvas>
    <div id="info"></div>
  </div>

  <aside>
    <div id="authBox" class="hidden">
      <h3>GİRİŞ / KAYIT</h3>
      <a class="gbtn" href="/auth/google">Google ile giriş yap</a>
      <input id="user" placeholder="Kullanıcı adı (3-20, harf/rakam/_)" autocomplete="username">
      <input id="pass" type="password" placeholder="Şifre (en az 10 karakter)" autocomplete="current-password">
      <button onclick="auth('login')">Giriş yap</button>
      <button onclick="auth('register')">Kayıt ol</button>
    </div>

    <div id="userBox" class="hidden">
      <h3>PROFİL</h3>
      <div id="profile"></div>
      <button onclick="logout()">Çıkış yap</button>
    </div>

    <h3>RENK PALETİ</h3>
    <div class="palette" id="palette"></div>
    <input type="color" id="custom" value="#7cb342" style="height:36px;padding:2px">

    <h3>RESİM YÜKLE</h3>
    <p style="font-size:12px;color:#8fa6bb;margin:0 0 6px">En fazla 400×400 piksele küçültülür. Yükle, haritada bir noktaya tıkla.</p>
    <input type="file" id="imgInput" accept="image/*">
    <button onclick="cancelImage()">Resmi iptal et</button>

    <div id="status"></div>
  </aside>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const SIZE = 16000;
const COOLDOWN_MS = 3000;
const MAX_IMG = 400;
const COLORS = ['#ffffff','#1a1c22','#e53935','#fb8c00','#fdd835',
                '#7cb342','#2e7d32','#00acc1','#1e88e5','#5e35b1',
                '#8e24aa','#ec407a','#6d4c41','#90a4ae','#37474f'];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let me = null;
let socket = null;
let selected = COLORS[5];
let view = { scale: 0.05, x: 0, y: 0 };
let fitted = false;
const pixels = new Map();
const landPaths = [];
let pendingImg = null;
let hoverWorld = null;
let queue = [];
let lastSent = 0;
let pumpTimer = null;
let drag = null;

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function openAuth(msg) {
  document.getElementById('authBox').classList.remove('hidden');
  document.getElementById('authBox').scrollIntoView({ behavior: 'smooth' });
  setStatus(msg);
}

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Hata');
  return j;
}

async function auth(kind) {
  try {
    await api('/api/' + kind, {
      username: document.getElementById('user').value,
      password: document.getElementById('pass').value,
    });
    location.href = '/';
  } catch (e) { setStatus(e.message); }
}

async function logout() {
  await api('/api/logout', {});
  location.href = '/';
}

// ---------- Dünya haritası ----------
function proj(lon, lat) {
  return [(lon + 180) / 360 * SIZE, (90 - lat) / 180 * SIZE];
}

function buildLand(gj) {
  for (const f of gj.features) {
    const g = f.geometry;
    if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates]
                : g.type === 'MultiPolygon' ? g.coordinates : [];
    const path = new Path2D();
    for (const poly of polys) {
      for (const ring of poly) {
        let off = 0, prev = null;
        ring.forEach(([lon, lat], i) => {
          if (prev !== null) {
            if (lon - prev > 180) off -= 360;
            else if (prev - lon > 180) off += 360;
          }
          prev = lon;
          const [x, y] = proj(lon + off, lat);
          i ? path.lineTo(x, y) : path.moveTo(x, y);
        });
        path.closePath();
      }
    }
    landPaths.push(path);
  }
  draw();
}

// ---------- Çizim ----------
function fitView() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  view.scale = Math.min(W / SIZE, H / SIZE) * 0.95;
  view.x = (W - SIZE * view.scale) / 2;
  view.y = (H - SIZE * view.scale) / 2;
}

function resize() {
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  if (!fitted) { fitView(); fitted = true; }
  draw();
}

function draw() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0f2236';
  ctx.fillRect(0, 0, W, H);

  ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y);

  ctx.fillStyle = '#132c44';
  ctx.fillRect(0, 0, SIZE, SIZE);

  ctx.fillStyle = '#4a8a72';
  for (const p of landPaths) ctx.fill(p, 'nonzero');
  ctx.strokeStyle = '#a6dcc2';
  ctx.lineWidth = 1 / view.scale;
  for (const p of landPaths) ctx.stroke(p);

  const x0 = -view.x / view.scale, y0 = -view.y / view.scale;
  const x1 = x0 + W / view.scale, y1 = y0 + H / view.scale;

  for (const [k, p] of pixels) {
    const x = k % SIZE, y = (k - x) / SIZE;
    if (x < x0 || x > x1 || y < y0 || y > y1) continue;
    ctx.fillStyle = p.c;
    ctx.fillRect(x, y, 1, 1);
  }

  if (pendingImg && hoverWorld) {
    ctx.globalAlpha = 0.6;
    for (const d of pendingImg.data) {
      ctx.fillStyle = d.color;
      ctx.fillRect(hoverWorld.x + d.dx, hoverWorld.y + d.dy, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = '#2d4d6b';
  ctx.lineWidth = 2 / view.scale;
  ctx.strokeRect(0, 0, SIZE, SIZE);
}

function screenToWorld(sx, sy) {
  return { x: Math.floor((sx - view.x) / view.scale), y: Math.floor((sy - view.y) / view.scale) };
}

function inBounds(w) { return w && w.x >= 0 && w.y >= 0 && w.x < SIZE && w.y < SIZE; }

function updateInfo() {
  let t = '';
  if (inBounds(hoverWorld)) {
    const p = pixels.get(hoverWorld.y * SIZE + hoverWorld.x);
    t = ` · (${hoverWorld.x}, ${hoverWorld.y})` + (p ? ` · sahibi: ${p.o}` : ' · boş');
  }
  document.getElementById('info').textContent = `${pixels.size} boyalı piksel${t}`;
}

// ---------- Fare ----------
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  hoverWorld = screenToWorld(e.clientX - r.left, e.clientY - r.top);
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; }
  }
  updateInfo();
  draw();
});

canvas.addEventListener('pointerup', () => {
  if (drag && !drag.moved) placeAt(hoverWorld);
  drag = null;
});

canvas.addEventListener('pointerleave', () => { hoverWorld = null; updateInfo(); draw(); });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const ns = Math.min(Math.max(view.scale * f, 0.01), 2);
  view.x = sx - (sx - view.x) * (ns / view.scale);
  view.y = sy - (sy - view.y) * (ns / view.scale);
  view.scale = ns;
  draw();
}, { passive: false });

// ---------- Piksel gönderme ----------
function placeAt(w) {
  if (!me || !me.username) {
    return openAuth('Piksel koymak için önce giriş yap veya Google ile devam et.');
  }
  if (!inBounds(w)) return;

  if (pendingImg) {
    const list = pendingImg.data
      .map((d) => ({ x: w.x + d.dx, y: w.y + d.dy, color: d.color }))
      .filter((p) => p.x >= 0 && p.y >= 0 && p.x < SIZE && p.y < SIZE);
    enqueue(list);
    const hrs = (list.length * COOLDOWN_MS / 3600000).toFixed(1);
    setStatus(`${list.length} piksel sıraya alındı. Tahmini süre: ${hrs} saat.`);
    pendingImg = null;
    draw();
  } else {
    enqueue([{ x: w.x, y: w.y, color: selected }]);
  }
}

function enqueue(list) {
  queue.push(...list);
  pump();
}

function pump() {
  if (pumpTimer || queue.length === 0) return;
  const wait = Math.max(0, lastSent + COOLDOWN_MS + 50 - Date.now());
  pumpTimer = setTimeout(() => {
    pumpTimer = null;
    const p = queue.shift();
    if (!p) return;
    socket.emit('place', p);
    lastSent = Date.now();
    if (queue.length) setStatus(`Sırada ${queue.length} piksel var.`);
    pump();
  }, wait);
}

// ---------- Renk paleti ----------
function markSel() {
  document.querySelectorAll('.sw').forEach((el) =>
    el.classList.toggle('sel', el.dataset.c === selected));
}

const pal = document.getElementById('palette');
COLORS.forEach((c) => {
  const d = document.createElement('div');
  d.className = 'sw';
  d.dataset.c = c;
  d.style.background = c;
  d.onclick = () => { selected = c; markSel(); };
  pal.appendChild(d);
});
document.getElementById('custom').addEventListener('input', (e) => {
  selected = e.target.value; markSel();
});
markSel();

// ---------- Resim yükleme (en fazla 400×400) ----------
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(MAX_IMG / img.width, MAX_IMG / img.height, 1);
    const w = Math.max(1, Math.round(img.width * s));
    const h = Math.max(1, Math.round(img.height * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h).data;
    const data = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] < 128) continue;
      const hex = '#' + [d[i], d[i + 1], d[i + 2]].map((v) => v.toString(16).padStart(2, '0')).join('');
      data.push({ dx: x, dy: y, color: hex });
    }
    pendingImg = { w, h, data };
    URL.revokeObjectURL(img.src);
    setStatus(`Resim hazır (${w}×${h}, ${data.length} piksel). Haritada bir noktaya tıkla.`);
    draw();
  };
  img.src = URL.createObjectURL(file);
});

function cancelImage() {
  pendingImg = null;
  document.getElementById('imgInput').value = '';
  setStatus('Resim iptal edildi.');
  draw();
}

// ---------- Socket ----------
function connect() {
  socket = io();
  socket.on('init', ({ pixels: list }) => {
    pixels.clear();
    for (const [k, c, o] of list) pixels.set(k, { c, o });
    updateInfo(); draw();
  });
  socket.on('update', ({ x, y, color, owner }) => {
    pixels.set(y * SIZE + x, { c: color, o: owner });
    updateInfo(); draw();
  });
  socket.on('error_msg', (msg) => {
    setStatus(msg);
    if (/giriş/i.test(msg)) document.getElementById('authBox').classList.remove('hidden');
  });
}

// ---------- Açılış ----------
async function boot() {
  me = await api('/api/me');
  if (me.username) {
    document.getElementById('userBox').classList.remove('hidden');
    document.getElementById('profile').textContent = `${me.username} · ${me.placed} piksel koydun`;
    document.getElementById('who').textContent = `Merhaba, ${me.username}`;
  } else {
    document.getElementById('authBox').classList.remove('hidden');
    document.getElementById('who').textContent = 'Piksel koymak için giriş yap';
  }

  if (new URLSearchParams(location.search).get('auth') === 'fail')
    setStatus('Google girişi başarısız oldu. Tekrar dene.');

  connect();
  window.addEventListener('resize', resize);
  resize();

  fetch('/world.geojson').then((r) => r.json()).then(buildLand)
    .catch(() => setStatus('world.geojson yüklenemedi.'));
}

boot();
</script>
</body>
</html>
