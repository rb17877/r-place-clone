<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101722">
<title>Bonkistan — Pixel Savaşı</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192333;--line:#304057;--text:#f2f6ff;--muted:#a6b3c8;--green:#a9f05c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}header{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#121b28;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:850}.brand span{color:var(--green)}.live,.connection{color:var(--muted);font-size:12px}.page{height:calc(100vh - 60px);padding:12px;max-width:1800px;margin:auto}.game{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}.map-card,.tools{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.map-card{display:flex;flex-direction:column;min-width:0}.mapbar{height:42px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.coords{color:var(--muted);font:11px ui-monospace,monospace}.map-wrap{position:relative;flex:1;min-height:250px;overflow:hidden;background:#10243a;touch-action:none;cursor:crosshair}.map-wrap.dragging{cursor:grabbing}canvas{display:block;width:100%;height:100%}.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:5px}.zoom button{width:34px;height:34px;border:1px solid #43536b;border-radius:7px;background:#192639ed;color:var(--text);font-size:18px;cursor:pointer}.tools{padding:16px;display:flex;flex-direction:column;gap:16px}.tools h1{font-size:16px;margin:0 0 4px}.sub{color:var(--muted);font-size:11px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.swatch{aspect-ratio:1;border:2px solid #ffffff30;border-radius:7px;cursor:pointer}.swatch.selected{border-color:white;box-shadow:0 0 0 2px var(--green)}.custom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:10px}.custom input{width:34px;height:26px;border:0;background:none}.status{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.status-row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.status-row b{color:var(--green)}.meter{height:4px;background:#334157;border-radius:5px;margin-top:8px;overflow:hidden}.meter div{height:100%;width:0;background:var(--green)}.connection{padding-top:10px}.dot{display:inline-block;width:8px;height:8px;background:#e8b451;border-radius:50%;margin-right:5px}.connected .dot{background:var(--green)}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#202d40;transition:.18s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.page{height:auto;min-height:calc(100vh - 60px)}.game{height:auto;grid-template-columns:1fr}.map-card{height:62vh;min-height:340px}.tools{min-height:260px}.mapbar{padding:0 8px}}
</style>
</head>
<body>
<header><div class="brand">✦ bonki<span>stan</span></div><div class="live">Pixel Savaşı · 16000 × 16000</div></header>
<main class="page"><div class="game">
<section class="map-card"><div class="mapbar"><strong>🌍 Dünya Piksel Savaşı</strong><span class="coords" id="coords">Piksel 0, 0</span></div><div class="map-wrap" id="mapWrap"><canvas id="map" aria-label="16000 × 16000 piksel alanı"></canvas><div class="zoom"><button id="zoomOut" aria-label="Uzaklaştır">−</button><button id="zoomIn" aria-label="Yakınlaştır">+</button><button id="reset" aria-label="Alanı ortala">⌖</button></div></div></section>
<aside class="tools"><header><h1>⚔️ Pixel Savaşı</h1><div class="sub">Haritaya rengini bırak!</div></header><section><strong>RENK PALETİ</strong><div class="palette" id="palette"></div><label class="custom"><span>Özel renk</span><input id="customColor" type="color" value="#a9f05c"></label></section><section class="status"><div class="status-row"><span id="statusText">Piksel seçip boya</span><b id="timerText">Hazır</b></div><div class="meter"><div id="meterBar"></div></div><div class="sub" style="margin-top:7px">3 saniyede bir piksel boyayabilirsin.</div></section><div class="connection" id="connection"><i class="dot"></i><span>Sunucuya bağlanıyor…</span></div></aside>
</div></main><div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(()=>{'use strict';
const WIDTH=16000,HEIGHT=16000,socket=io(),wrap=document.getElementById('mapWrap'),canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const colors=['#ffffff','#151a23','#e64b45','#ff9138','#ffd34d','#a9f05c','#37c879','#2ac5c0','#3985ff','#6654e8','#ab78f5','#ef70c4','#87583c','#9ba8b7','#586477'];
const pixels=new Map();let selected='#a9f05c',scale=1,ox=0,oy=0,drag=false,moved=false,last=null,nextPaint=0,toastTimer;
function draw(){const w=wrap.clientWidth,h=wrap.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#10243a';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#24435a';ctx.fillRect(0,0,WIDTH,HEIGHT);for(const [key,color] of pixels){const [x,y]=key.split(',').map(Number);ctx.fillStyle=color;ctx.fillRect(x,y,1,1)}if(scale>3){ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1/scale;ctx.beginPath();for(let x=0;x<=WIDTH;x+=1){ctx.moveTo(x,0);ctx.lineTo(x,HEIGHT)}for(let y=0;y<=HEIGHT;y+=1){ctx.moveTo(0,y);ctx.lineTo(WIDTH,y)}ctx.stroke()}ctx.restore();document.getElementById('coords').textContent=`Zoom ${Math.round(scale*100)}% · ${pixels.size.toLocaleString('tr-TR')} piksel`}
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;scale=Math.min(w/WIDTH,h/HEIGHT);ox=(w-WIDTH*scale)/2;oy=(h-HEIGHT*scale)/2;draw()}
function resize(){const d=Math.min(devicePixelRatio||1,2),r=wrap.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);fit()}
function point(cx,cy){const r=wrap.getBoundingClientRect();return{x:Math.floor((cx-r.left-ox)/scale),y:Math.floor((cy-r.top-oy)/scale)}}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function choose(c){selected=c.toLowerCase();document.getElementById('customColor').value=selected;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===selected))}
for(const c of colors){const b=document.createElement('button');b.type='button';b.className='swatch';b.dataset.color=c;b.style.background=c;b.title=c;b.addEventListener('click',()=>choose(c));document.getElementById('palette').appendChild(b)}choose(selected);document.getElementById('customColor').addEventListener('input',e=>choose(e.target.value));
function timer(){const left=Math.max(0,nextPaint-Date.now());document.getElementById('timerText').textContent=left?`${(left/1000).toFixed(1)} sn`:'Hazır';document.getElementById('meterBar').style.width=`${100-left/30}%`;document.getElementById('statusText').textContent=left?'Bekleme süresi':'Piksel seçip boya'}
function paint(p){if(!socket.connected)return toast('Sunucu bağlantısı yok.');if(p.x<0||p.x>=WIDTH||p.y<0||p.y>=HEIGHT)return toast('Alan dışında boyama yapılamaz.');if(Date.now()<nextPaint)return toast('Yeni piksel için bekle.');socket.emit('place',{...p,color:selected},r=>{if(!r||!r.ok){if(r&&r.wait)nextPaint=Date.now()+r.wait;toast(r&&r.error||'Piksel yerleştirilemedi.');timer();return}nextPaint=r.nextPaintAt;timer()})}
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;drag=true;moved=false;last={x:e.clientX,y:e.clientY};wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;ox+=dx;oy+=dy;last={x:e.clientX,y:e.clientY};draw()});
function end(e){if(!drag)return;if(!moved)paint(point(e.clientX,e.clientY));drag=false;last=null;wrap.classList.remove('dragging')}
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',()=>{drag=false;last=null;wrap.classList.remove('dragging')});
function zoom(f,x=wrap.clientWidth/2,y=wrap.clientHeight/2){const old=scale;scale=Math.max(.0005,Math.min(100,scale*f));ox=x-(x-ox)*scale/old;oy=y-(y-oy)*scale/old;draw()}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoom(e.deltaY<0?1.2:.83,e.clientX-r.left,e.clientY-r.top)},{passive:false});document.getElementById('zoomIn').onclick=()=>zoom(1.3);document.getElementById('zoomOut').onclick=()=>zoom(.77);document.getElementById('reset').onclick=fit;
socket.on('init',data=>{pixels.clear();for(const [key,c] of Object.entries(data||{}))if(/^\d+,\d+$/.test(key)&&/^#[0-9a-f]{6}$/i.test(c))pixels.set(key,c);draw()});socket.on('update',p=>{if(p.x>=0&&p.x<WIDTH&&p.y>=0&&p.y<HEIGHT){pixels.set(`${p.x},${p.y}`,p.color);draw()}});socket.on('imageUpdate',list=>{for(const p of list||[])pixels.set(`${p.x},${p.y}`,p.color);draw()});socket.on('connect',()=>{const e=document.getElementById('connection');e.classList.add('connected');e.lastElementChild.textContent='Bağlandı'});socket.on('disconnect',()=>{const e=document.getElementById('connection');e.classList.remove('connected');e.lastElementChild.textContent='Bağlantı kesildi'});socket.on('connect_error',()=>{document.getElementById('connection').lastElementChild.textContent='Sunucuya bağlanılamadı'});
resize();setInterval(timer,200);window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
